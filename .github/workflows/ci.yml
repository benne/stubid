name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Called by release.yml, so a release is gated on the same checks a pull request is rather
  # than on a second, weaker definition of "verified". A tag push does not match the branch
  # filter above, so this does not fire twice; and a called workflow sees the caller's event,
  # which is what keeps the pull-request-only sign-off job correctly skipped.
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - run: dotnet restore

      - run: dotnet build --no-restore --configuration Release

      # The container tests are held back by trait rather than by project, so a new one cannot
      # join the cross-platform matrix by accident. Windows runners have no Linux Docker
      # daemon, and a test that needs one there fails for a reason nobody can fix.
      - run: dotnet test --no-build --configuration Release --filter "Category!=Container"

      # Packing here rather than only at release time, because everything that can go wrong
      # with it goes wrong quietly: the server's discovery template is derived from a fixture
      # outside its own project cone, the Web SDK needs an explicit IsPackable, and a project
      # added later packs by default whether or not anyone meant it to.
      - run: dotnet pack --no-build --configuration Release --output artifacts

      - name: The package set is the one we mean to publish
        shell: bash
        run: |
          expected="StubId.Abstractions StubId.Client StubId.InProcess StubId.Profiles.Abstractions StubId.Server StubId.Testing StubId.Wire"
          for kind in nupkg snupkg; do
            actual=$(ls artifacts/*.$kind | sed -E 's|.*/([A-Za-z.]+)\.[0-9].*|\1|' | sort | tr '\n' ' ')
            [ "$actual" = "$(echo $expected | tr ' ' '\n' | sort | tr '\n' ' ')" ] || {
              echo "::error::Unexpected .$kind set. Wanted: $expected. Got: $actual"; exit 1; }
          done
          # A spike that answers 501 to every route it declares, and the recording harness.
          for unwanted in StubId.Profiles.Idura StubId.CaptureHarness; do
            ! ls artifacts/$unwanted.*.nupkg >/dev/null 2>&1 || {
              echo "::error::$unwanted must not be published"; exit 1; }
          done

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Fixtures are recorded from a real broker. This is the backstop for the scrubbing
      # step, not a replacement for it.
      #
      # Run gitleaks directly rather than through its action: the action scans git history
      # and fails on this repository with "stderr is not empty", and scanning the working
      # tree is what we actually want.
      - run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            dir /repo --redact --no-banner --config /repo/.gitleaks.toml

  # CONTRIBUTING asks for a sign-off on every commit: the contributor certifying they have the
  # right to submit the work. A trailer naming somebody else certifies nothing, so it has to
  # match the commit's own author.
  #
  # Pull requests only. A commit that reaches master unsigned is already there, and the merge
  # commits GitHub writes for us are nobody's to sign.
  sign-off:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git log --no-merges --format=%H "$BASE..$HEAD"); do
            author=$(git log -1 --format=%ae "$sha")
            signed=$(git log -1 --format='%(trailers:key=Signed-off-by,valueonly,unfold=true)' "$sha")
            if ! printf '%s' "$signed" | grep -qiF "<$author>"; then
              echo "::error::$(git log -1 --format='%h %s' "$sha") is not signed off by $author"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo
            echo "Every commit needs a Signed-off-by trailer matching its author."
            echo "Write new ones with 'git commit -s'; fix a branch with 'git rebase --signoff $BASE'."
            exit 1
          fi

  # The three client stacks a Danish team actually uses. The .NET handler runs in-process with
  # the unit tests; these two run against the image this job builds from the commit under test,
  # which is the point - a stack proved against an older published image proves nothing about
  # the change. They check what .NET forgives: openid-client compares the discovered issuer
  # with the configured authority character for character, and Spring derives candidate
  # metadata locations from a path-bearing issuer and asserts the issuer it finds.
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the image
        run: docker build -t stubid:ci .

      - name: The container itself, and a restart a cached document survives
        run: ./scripts/verify-container.sh stubid:ci

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # The module a .NET suite would reach for, against the image this job just built and verified.
      # STUBID_TEST_IMAGE is what stops it building one of its own, which is the path a developer
      # with no image takes.
      - name: The Testcontainers module
        env:
          STUBID_TEST_IMAGE: stubid:ci
        run: >
          dotnet test tests/StubId.Testing.Tests
          --configuration Release
          --filter "Category=Container"

      - name: Start it for the client stacks
        run: |
          docker run -d --name stubid -p 18080:8080 -v stubid-keys:/keys \
            -e StubId__PublicBaseUrl=http://localhost:18080 stubid:ci
          for _ in $(seq 1 40); do
            curl -fsS -o /dev/null http://localhost:18080/op/.well-known/openid-configuration && break
            sleep 0.5
          done

      # A second instance, because the issuer is stored data: one instance publishes one address,
      # and http://localhost:18080/op and https://localhost:18443/op are two of them. The plain one
      # keeps running - plain HTTP is what the image does by default, and both client stacks are
      # checked in both modes.
      - name: Start a second one that serves TLS
        run: |
          docker run -d --name stubid-tls -p 18081:8080 -p 18443:8443 \
            -v stubid-tls-keys:/keys \
            -e StubId__Tls=self-signed \
            -e StubId__PublicBaseUrl=https://localhost:18443 stubid:ci
          for _ in $(seq 1 40); do
            curl -fsS -o /dev/null http://localhost:18081/_stubid/health/ready && break
            sleep 0.5
          done

      # The bootstrap that needs no trust: the certificate comes off the plain-HTTP control port,
      # and everything after this is an ordinary trust mechanism handed an ordinary file. Nothing
      # is installed into a system trust store here or anywhere else.
      - name: Take the certificate the way a client stack would
        run: |
          curl -fsS http://localhost:18081/_stubid/v1/runtime/tls-certificate.pem \
            -o "${{ runner.temp }}/stubid.crt"
          openssl x509 -in "${{ runner.temp }}/stubid.crt" -noout \
            -subject -dates -ext subjectAltName,basicConstraints
          curl -fsS --cacert "${{ runner.temp }}/stubid.crt" -o /dev/null \
            https://localhost:18443/op/.well-known/openid-configuration

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # STUBID_AUTHORITY is named rather than left to the script's default, which is the port
      # the guide tells a reader to publish rather than the one this job happens to use.
      - name: Node, with openid-client
        working-directory: samples/node
        env:
          STUBID_AUTHORITY: http://localhost:18080/op
        run: |
          npm install --no-audit --no-fund
          node signin.mjs

      # The same script against the secured instance, where it passes openid-client no allowance at
      # all - it decides that from the authority's scheme. NODE_EXTRA_CA_CERTS adds to node's
      # bundled roots rather than replacing them, and is read once when the process starts.
      - name: Node, over TLS, with nothing relaxed
        working-directory: samples/node
        env:
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/stubid.crt
          STUBID_AUTHORITY: https://localhost:18443/op
        run: node signin.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Java, with Spring Security
        working-directory: tests/interop-spring
        run: mvn -q -B compile exec:java

      # A JVM reads no operating-system trust store, so this is a file rather than a system step.
      # The file is a copy of the JDK's own cacerts with one certificate added, because
      # javax.net.ssl.trustStore replaces the default trust rather than extending it - point it at a
      # store holding only StubID and Maven can no longer verify Maven Central. exec:java runs the
      # class in Maven's own JVM, which is what MAVEN_OPTS reaches.
      - name: Java, over TLS, with nothing relaxed
        working-directory: tests/interop-spring
        env:
          STUBID_AUTHORITY: https://localhost:18443/op
        run: |
          cp "$JAVA_HOME/lib/security/cacerts" "${{ runner.temp }}/stubid-truststore.p12"
          # The JDK ships cacerts read-only and cp keeps the mode, so keytool would read the copy,
          # add to it, and fail writing it back.
          chmod u+w "${{ runner.temp }}/stubid-truststore.p12"
          keytool -importcert -noprompt -alias stubid \
            -file "${{ runner.temp }}/stubid.crt" \
            -keystore "${{ runner.temp }}/stubid-truststore.p12" -storepass changeit
          MAVEN_OPTS="-Djavax.net.ssl.trustStore=${{ runner.temp }}/stubid-truststore.p12 \
            -Djavax.net.ssl.trustStorePassword=changeit" mvn -q -B compile exec:java

      # The one thing no other stack here can check. A browser makes the trust decision in its own
      # TLS stack rather than the platform's - each of the three engines by a different mechanism,
      # and Chromium and Firefox want opposite flags - and it runs the form_post page's auto-submit,
      # which needs a JavaScript engine. Every engine is refused first, so the trust is provably
      # what makes the sign-in work.
      #
      # Inside the Playwright image rather than on the runner: it carries the browsers its own npm
      # package expects, and every trust install is then thrown away with the container, so nothing
      # is written into the runner's own stores. It enqueues refusals, so it runs after the Node and
      # Java legs that share this instance.
      - name: A browser signs in, in three engines, over TLS
        run: |
          docker run --rm --network host \
            -v "$PWD/tests/interop-browser:/suite:ro" \
            -v "${{ runner.temp }}/stubid.crt:/certs/stubid.crt:ro" \
            -e STUBID_AUTHORITY=https://localhost:18443/op \
            -e STUBID_CONTROL=http://localhost:18081 \
            -e STUBID_CERT=/certs/stubid.crt \
            mcr.microsoft.com/playwright:v1.62.1-noble \
            bash /suite/matrix.sh

      - name: What the containers said, if anything went wrong
        if: failure()
        run: |
          docker logs stubid
          docker logs stubid-tls
