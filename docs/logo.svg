<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     role="img" aria-label="StubID">
  <title>StubID</title>
  <!-- One flat colour rather than a prefers-color-scheme pair. The site's theme switcher sets
       an attribute on the host page, and this file is loaded through <img>, so it is a separate
       document that cannot see it - a dark-mode rule here would follow the operating system and
       disagree with the page whenever a reader picks a theme against it. This blue is legible on
       both grounds, and it is the one the .ico carries, so the tab and the header match. -->
  <g fill="#2273C4">
    <!-- The card, drawn as a dashed outline: identity-shaped, and openly not real. pathLength
         normalises the perimeter to 100 so eight dashes divide it exactly, and the offset centres
         one on each edge rather than leaving the joint at a corner. -->
    <path fill="none" stroke="#2273C4" stroke-width="2.5" pathLength="100"
          stroke-dasharray="7.25 5.25" stroke-dashoffset="3.625"
          d="M16 6.25 H23.55 A4.2 4.2 0 0 1 27.75 10.45 V21.55 A4.2 4.2 0 0 1 23.55 25.75
             H8.45 A4.2 4.2 0 0 1 4.25 21.55 V10.45 A4.2 4.2 0 0 1 8.45 6.25 Z"/>
    <circle cx="16" cy="13.6" r="3.15"/>
    <path d="M11 22.9 a5 5 0 0 1 10 0 Z"/>
  </g>
</svg>
